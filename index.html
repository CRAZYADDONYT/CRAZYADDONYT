<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuthFlow - Secure Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="navbar">
      <h1>AuthFlow</h1>
      <div id="navUser" class="nav-user hidden">
        <span id="userAvatar" class="avatar"></span>
        <span id="userName"></span>
        <button id="logoutBtn" class="btn btn-secondary">Logout</button>
      </div>
    </header>

    <main class="container">
      <!-- Login Card -->
      <section id="loginSection" class="card auth-card">
        <h2>Welcome back</h2>
        <p class="muted">Sign in to continue to your dashboard.</p>

        <form id="loginForm" novalidate>
          <label for="loginIdentifier">Username or Email</label>
          <input id="loginIdentifier" type="text" placeholder="you@example.com" required />

          <label for="loginPassword">Password</label>
          <div class="password-row">
            <input id="loginPassword" type="password" placeholder="••••••••" required />
            <button type="button" id="toggleLoginPassword" class="btn-icon">Show</button>
          </div>

          <div class="row between">
            <label class="checkbox"><input id="rememberMe" type="checkbox" /> Remember me</label>
            <a href="#" id="forgotPasswordLink">Forgot password?</a>
          </div>

          <button type="submit" class="btn">Login</button>
          <p class="switch-text">No account yet? <a href="#" id="toSignupLink">Sign Up</a></p>
        </form>
      </section>

      <!-- Signup Card -->
      <section id="signupSection" class="card auth-card hidden">
        <h2>Create account</h2>
        <p class="muted">Set up your account in less than a minute.</p>

        <form id="signupForm" novalidate>
          <label for="signupUsername">Username</label>
          <input id="signupUsername" type="text" required />

          <label for="signupEmail">Email</label>
          <input id="signupEmail" type="email" required />

          <label for="signupPassword">Password</label>
          <div class="password-row">
            <input id="signupPassword" type="password" required />
            <button type="button" id="toggleSignupPassword" class="btn-icon">Show</button>
          </div>

          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" type="password" required />

          <button type="submit" class="btn">Create Account</button>
          <p class="switch-text">Already have an account? <a href="#" id="toLoginLink">Login</a></p>
        </form>
      </section>

      <!-- Dashboard -->
      <section id="dashboardSection" class="card hidden">
        <h2>Dashboard</h2>
        <p id="dashboardText">You are now signed in.</p>
      </section>

      <p id="formMessage" class="message"></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
